<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glassmorphism Dynamic Design Studio</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
            --accent-neon: #38bdf8;
            --accent-purple: #818cf8;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --border-slate: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        header {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            padding: 20px 40px;
            border-bottom: 1px solid var(--border-slate);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(to right, var(--accent-neon), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .tag {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.2);
            color: var(--accent-neon);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .main-container {
            display: flex;
            flex: 1;
            padding: 40px;
            gap: 40px;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
        }

        /* Control Panel Styles */
        .control-panel {
            flex: 1;
            background: var(--panel-bg);
            border: 1px solid var(--border-slate);
            border-radius: 24px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .panel-section h3 {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 16px;
            font-weight: 700;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
        }

        .control-label-row {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: 500;
        }

        .control-label-row span:last-child {
            color: var(--accent-neon);
            font-family: monospace;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: var(--border-slate);
            border-radius: 10px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: var(--accent-neon);
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.1s;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            cursor: pointer;
            background: transparent;
        }

        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        input[type="color"]::-webkit-color-swatch {
            border: 1px solid var(--border-slate);
            border-radius: 8px;
        }

        .color-picker-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Code Output Area */
        .code-box {
            background: #090d16;
            border: 1px solid var(--border-slate);
            border-radius: 16px;
            padding: 20px;
            position: relative;
            margin-top: auto;
        }

        .code-box pre {
            font-family: 'Fira Code', monospace;
            font-size: 13px;
            color: #e2e8f0;
            overflow-x: auto;
            line-height: 1.6;
        }

        .btn-copy {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-slate);
            color: var(--text-light);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-copy:hover {
            background: var(--accent-neon);
            color: var(--bg-dark);
            border-color: var(--accent-neon);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }

        /* Interactive Preview Canvas */
        .preview-pane {
            flex: 1.2;
            background: #0b0f19;
            border: 1px solid var(--border-slate);
            border-radius: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.5);
            min-height: 500px;
        }

        /* Moving abstract geometric objects behind glass to emphasize blur blur effect */
        .bg-shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(0px);
            animation: float 12s infinite alternate ease-in-out;
        }

        .shape-1 {
            width: 250px;
            height: 250px;
            background: linear-gradient(45deg, #ff007f, #7928ca);
            top: 20%;
            left: 15%;
        }

        .shape-2 {
            width: 300px;
            height: 300px;
            background: linear-gradient(45deg, #00dfd8, #007cf0);
            bottom: 15%;
            right: 10%;
            animation-delay: -4s;
        }

        .shape-3 {
            width: 18px;
            height: 180px;
            background: linear-gradient(45deg, #feb47b, #ff7e5f);
            top: 50%;
            right: 45%;
            animation-delay: -8s;
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg) scale(1); }
            100% { transform: translateY(40px) rotate(180deg) scale(1.1); }
        }

        /* The Live Glass Plate Card */
        .glass-preview-card {
            width: 380px;
            height: 240px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 40px;
            transition: all 0.05s ease;
        }

        .glass-preview-card h2 {
            font-size: 24px;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .glass-preview-card p {
            font-size: 14px;
            color: rgba(255,255,255,0.7);
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <header>
        <h1>GlassUI Studio</h1>
        <div class="tag">CSS Engine Active</div>
    </header>

    <div class="main-container">
        
        <!-- LEFT PANEL: Dynamic Control Nodes -->
        <div class="control-panel">
            <div class="panel-section">
                <h3>Glass Modification Metrics</h3>
                
                <div class="control-group">
                    <div class="control-label-row">
                        <label>Blur Intensity</label>
                        <span id="valBlur">12px</span>
                    </div>
                    <input type="range" id="inputBlur" min="0" max="25" value="12" oninput="generateGlassCSS()">
                </div>

                <div class="control-group">
                    <div class="control-label-row">
                        <label>Transparency Opacity</label>
                        <span id="valOpacity">0.15</span>
                    </div>
                    <input type="range" id="inputOpacity" min="0" max="100" value="15" oninput="generateGlassCSS()">
                </div>

                <div class="control-group">
                    <div class="control-label-row">
                        <label>Border Line Radius</label>
                        <span id="valRadius">24px</span>
                    </div>
                    <input type="range" id="inputRadius" min="0" max="50" value="24" oninput="generateGlassCSS()">
                </div>

                <div class="control-group">
                    <div class="control-label-row">
                        <label>Glass Tint Color</label>
                    </div>
                    <div class="color-picker-row">
                        <input type="color" id="inputColor" value="#ffffff" oninput="generateGlassCSS()">
                        <span style="font-size: 14px; color: var(--text-muted)">Adjust base highlight plate hue</span>
                    </div>
                </div>
            </div>

            <!-- CSS Code Realtime Output Terminal Block -->
            <div class="code-box">
                <button class="btn-copy" onclick="copyCodeToClipboard()">Copy CSS</button>
                <pre><code id="cssCodeOutput">Loading styles...</code></pre>
            </div>
        </div>

        <!-- RIGHT PANEL: Fluid Visual Canvas -->
        <div class="preview-pane">
            <!-- Animated background targets to visually showcase back-plate blurring -->
            <div class="bg-shape shape-1"></div>
            <div class="bg-shape shape-2"></div>
            <div class="bg-shape shape-3"></div>

            <!-- Realtime rendering interface object -->
            <div class="glass-preview-card" id="glassCard">
                <h2>Interactive Preview</h2>
                <p>Move sliders inside the studio panel grid. Watch how background blur metrics interact dynamically with floating geometric matrix objects.</p>
            </div>
        </div>

    </div>

    <script>
        // Convert hex value layout directly to raw rgba conversion strings
        function hexToRgb(hex) {
            let c;
            if(/^#([A-Fa-f0-9]{3}){1,2}$/.test(hex)){
                c= hex.substring(1).split('');
                if(c.length== 3){
                    c= [c[0], c[0], c[1], c[1], c[2], c[2]];
                }
                c= '0x' + c.join('');
                return [(c>>16)&255, (c>>8)&255, c&255].join(', ');
            }
            return '255, 255, 255';
        }

        // Live styling controller calculation compilation block
        function generateGlassCSS() {
            const blur = document.getElementById('inputBlur').value;
            const opacity = document.getElementById('inputOpacity').value / 100;
            const radius = document.getElementById('inputRadius').value;
            const hexColor = document.getElementById('inputColor').value;
            
            const rgbColor = hexToRgb(hexColor);

            // Update user interface metric badges
            document.getElementById('valBlur').innerText = blur + "px";
            document.getElementById('valOpacity').innerText = opacity;
            document.getElementById('valRadius').innerText = radius + "px";

            // Compile style rules matching standard glassmorphism web criteria
            const cardTarget = document.getElementById('glassCard');
            
            cardTarget.style.background = `rgba(${rgbColor}, ${opacity})`;
            cardTarget.style.backdropFilter = `blur(${blur}px)`;
            cardTarget.style.webkitBackdropFilter = `blur(${blur}px)`;
            cardTarget.style.borderRadius = `${radius}px`;
            cardTarget.style.border = `1px solid rgba(${rgbColor}, ${opacity + 0.15})`;

            // Generate clean code text block
            const generatedStylesText = 
`background: rgba(${rgbColor}, ${opacity});\n` +
`backdrop-filter: blur(${blur}px);\n` +
`-webkit-backdrop-filter: blur(${blur}px);\n` +
`border-radius: ${radius}px;\n` +
`border: 1px solid rgba(${rgbColor}, ${(opacity + 0.15).toFixed(2)});`;

            document.getElementById('cssCodeOutput').innerText = generatedStylesText;
        }

        // Clip data logic 
        function copyCodeToClipboard() {
            const textToCopy = document.getElementById('cssCodeOutput').innerText;
            navigator.clipboard.writeText(textToCopy).then(() => {
                const copyBtn = document.querySelector('.btn-copy');
                copyBtn.innerText = "Copied! ✓";
                setTimeout(() => {
                    copyBtn.innerText = "Copy CSS";
                }, 2000);
            });
        }

        // Run initialization on load window state matrix parameters
        window.onload = generateGlassCSS;
    </script>
</body>
</html>
