<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake Chat Generator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            display: flex;
            background: white;
            width: 900px;
            max-width: 100%;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        /* Left Control Panel */
        .control-panel {
            flex: 1;
            padding: 30px;
            border-right: 1px solid #e0e0e0;
            background: #fafafa;
        }

        .control-panel h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #555;
            font-size: 14px;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        .btn {
            background-color: #25D366;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: #1ebd58;
        }

        /* Right Preview Panel */
        .preview-panel {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #e5ddd5;
            padding: 30px;
        }

        /* Mock Phone Frame */
        .phone-mockup {
            width: 320px;
            height: 580px;
            background: #efe7dd; /* Classic WA background color */
            border: 12px solid #333;
            border-radius: 36px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            position: relative;
        }

        /* WhatsApp Header Style */
        .chat-header {
            background: #075E54;
            color: white;
            padding: 15px 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 36px;
            height: 36px;
            background: #ccc;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #555;
            font-size: 14px;
        }

        .user-info .name {
            font-weight: bold;
            font-size: 15px;
        }

        .user-info .status {
            font-size: 11px;
            opacity: 0.8;
        }

        /* Chat Area */
        .chat-body {
            flex: 1;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
        }

        .message {
            max-width: 75%;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            position: relative;
            line-height: 1.4;
            word-wrap: break-word;
        }

        /* Received Message (Left) */
        .message.received {
            background: white;
            align-self: flex-start;
            border-top-left-radius: 0;
        }

        /* Sent Message (Right) */
        .message.sent {
            background: #DCF8C6;
            align-self: flex-end;
            border-top-right-radius: 0;
        }

        /* Footer input mockup */
        .chat-footer {
            background: #f0f0f0;
            padding: 10px;
            display: flex;
            align-items: center;
            font-size: 12px;
            color: #999;
            border-top: 1px solid #ddd;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="control-panel">
        <h2>Chat Settings</h2>
        
        <div class="form-group">
            <label for="inputName">Person's Name</label>
            <input type="text" id="inputName" value="John Doe" oninput="updateHeader()">
        </div>

        <div class="form-group">
            <label for="inputStatus">Status (e.g., online, typing...)</label>
            <input type="text" id="inputStatus" value="online" oninput="updateHeader()">
        </div>

        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
        
        <h3>Add Message</h3>
        <div class="form-group">
            <label for="msgSender">Sender</label>
            <select id="msgSender">
                <option value="received">Person (Left)</option>
                <option value="sent">You (Right)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="msgText">Message Text</label>
            <textarea id="msgText" rows="3" placeholder="Type a fake message..."></textarea>
        </div>

        <button class="btn" onclick="addMessage()">Add Message to Chat</button>
    </div>

    <div class="preview-panel">
        <div class="phone-mockup">
            
            <div class="chat-header">
                <div class="avatar" id="previewAvatar">J</div>
                <div class="user-info">
                    <div class="name" id="previewName">John Doe</div>
                    <div class="status" id="previewStatus">online</div>
                </div>
            </div>

            <div class="chat-body" id="chatBody">
                <div class="message received">Hey! How does this look?</div>
                <div class="message sent">Looks just like a real chat!</div>
            </div>

            <div class="chat-footer">
                Type a message...
            </div>

        </div>
    </div>
</div>

<script>
    // Live update Header Details
    function updateHeader() {
        const name = document.getElementById('inputName').value;
        const status = document.getElementById('inputStatus').value;
        
        document.getElementById('previewName').innerText = name ? name : "Name";
        document.getElementById('previewStatus').innerText = status;
        
        // Update avatar first letter
        document.getElementById('previewAvatar').innerText = name ? name.charAt(0).toUpperCase() : "?";
    }

    // Add a new message dynamically
    function addMessage() {
        const sender = document.getElementById('msgSender').value;
        const text = document.getElementById('msgText').value.trim();
        const chatBody = document.getElementById('chatBody');

        if (text === "") {
            alert("Please enter some text first!");
            return;
        }

        // Create new message div
        const messageDiv = document.createElement('div');
        messageDiv.classList.add('message', sender);
        messageDiv.innerText = text;

        // Append to chat body
        chatBody.appendChild(messageDiv);

        // Scroll to the bottom of the chat
        chatBody.scrollTop = chatBody.scrollHeight;

        // Clear textarea
        document.getElementById('msgText').value = "";
    }
</script>

</body>
</html>
